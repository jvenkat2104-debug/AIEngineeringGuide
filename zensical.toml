[project.theme]
custom_dir = "site/overrides"
language = "en"
features = ["navigation.tabs", "navigation.sections", "navigation.indexes", "navigation.top", "search.highlight", "content.code.copy"]
font = false

[project.theme.palette]
scheme = "default"
primary = "teal"
accent = "teal"

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
tables = {}
admonition = {}
pymdownx.details = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
